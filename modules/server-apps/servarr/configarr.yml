# API keys and the Transmission password are read at runtime from configarr.env.
# Pin upstream definitions so a routine deployment does not change HDR matching.
trashRevision: 529bd9c29eb41f38e36c14c41a137f4d5d824c99

sonarr:
  main:
    base_url: http://127.0.0.1:8989
    api_key: !env SONARR_API_KEY
    custom_formats:
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e # HDR
        assign_scores_to:
          - name: Ultra-HD
            score: 500
      - trash_ids:
          - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
        assign_scores_to:
          - name: Ultra-HD
            score: 1000
    quality_profiles:
      - name: Ultra-HD
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 1000
        min_format_score: 0
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
    download_clients:
      data:
        - name: Transmission
          type: transmission
          enable: true
          fields:
            host: localhost
            port: 9091
            username: media
            password: !env TRANSMISSION_RPC_PASSWORD
            tv_category: sonarr
      delete_unmanaged:
        enabled: false

radarr:
  main:
    base_url: http://127.0.0.1:7878
    api_key: !env RADARR_API_KEY
    # These formats and scores already exist in the live Radarr database.
    custom_formats:
      - trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405 # HDR
        assign_scores_to:
          - name: Ultra-HD
            score: 500
      - trash_ids:
          - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost
        assign_scores_to:
          - name: Ultra-HD
            score: 1000
    quality_profiles:
      - name: Ultra-HD
        language: Original
        upgrade:
          allowed: true
          until_quality: Remux-2160p
          until_score: 1000
        min_format_score: 0
        qualities:
          - name: Remux-2160p
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: HDTV-2160p
    download_clients:
      data:
        - name: Transmission
          type: transmission
          enable: true
          fields:
            host: localhost
            port: 9091
            username: media
            password: !env TRANSMISSION_RPC_PASSWORD
            movie_category: radarr
      delete_unmanaged:
        enabled: false

prowlarr:
  main:
    base_url: http://127.0.0.1:9696
    api_key: !env PROWLARR_API_KEY
    indexers:
      data:
        - name: Knaben
          definition: Knaben
          enable: true
        - name: LimeTorrents
          definition: limetorrents
          enable: true
        - name: Nyaa.si
          definition: nyaasi
          enable: true
        - name: YTS
          definition: yts
          enable: true
      delete_unmanaged:
        enabled: false
    applications:
      data:
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://localhost:9696
            baseUrl: http://localhost:8989
            apiKey: !env SONARR_API_KEY
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://localhost:9696
            baseUrl: http://localhost:7878
            apiKey: !env RADARR_API_KEY
      delete_unmanaged:
        enabled: false
      sync_indexers: false
