name: System upgrade cache

on:
  pull_request:
  push:
    branches:
      - "system-upgrade*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-upgrade-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.profile }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: nixos
            system: x86_64-linux
            runner: ubuntu-24.04
          - profile: nixos-arm-parallels
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - profile: nixos-orbstack
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - profile: nixos-server
            system: aarch64-linux
            runner: ubuntu-24.04-arm

    env:
      ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
      ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      NIX_CONFIG: |
        accept-flake-config = true
        experimental-features = nix-command flakes
        build-dir = /nix/build
        extra-substituters = https://nix-community.cachix.org https://nixos-raspberrypi.cachix.org
        extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand Nix store
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: rampage
          witness-carnage: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Join tailnet
        if: startsWith(github.ref_name, 'system-upgrade') || github.head_ref == 'upgrade-validation-attic-cache'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Enable Attic
        if: startsWith(github.ref_name, 'system-upgrade') || github.head_ref == 'upgrade-validation-attic-cache'
        shell: bash
        run: |
          nix run nixpkgs#attic-client -- login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          {
            echo 'NIX_CONFIG<<EOF'
            printf '%s\n' "$NIX_CONFIG"
            echo "extra-substituters = $ATTIC_ENDPOINT/dotfiles"
            echo "extra-trusted-public-keys = $ATTIC_PUBLIC_KEY"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Build host closure
        shell: bash
        run: |
          started=$SECONDS
          nix build \
            --no-link \
            --print-out-paths \
            ".#nixosConfigurations.${{ matrix.profile }}.config.system.build.toplevel" \
            | tee "$RUNNER_TEMP/built-paths.txt"
          echo "Build elapsed: $((SECONDS - started))s"

      - name: Publish closure to Attic
        if: startsWith(github.ref_name, 'system-upgrade') || github.head_ref == 'upgrade-validation-attic-cache'
        timeout-minutes: 90
        shell: bash
        run: |
          sudo install -d -m 1777 /nix/attic-tmp
          started=$SECONDS
          TMPDIR=/nix/attic-tmp nix run nixpkgs#attic-client -- push --jobs 1 ci:dotfiles --stdin < "$RUNNER_TEMP/built-paths.txt"
          echo "Attic publish elapsed: $((SECONDS - started))s"

      - name: Prepare cold Attic payload
        if: github.head_ref == 'upgrade-validation-attic-cache'
        shell: bash
        run: |
          cold_dir="$RUNNER_TEMP/attic-cold-${{ matrix.profile }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$cold_dir"
          dd if=/dev/urandom of="$cold_dir/payload.bin" bs=1M count=64 status=progress
          nix store add-path "$cold_dir" > "$RUNNER_TEMP/cold-attic-path.txt"
          printf '%s\n' $((64 * 1024 * 1024)) > "$RUNNER_TEMP/cold-attic-bytes.txt"
          echo "Cold store path: $(cat "$RUNNER_TEMP/cold-attic-path.txt")"

      - name: Benchmark cold Attic upload
        if: github.head_ref == 'upgrade-validation-attic-cache'
        timeout-minutes: 15
        shell: bash
        run: |
          sudo install -d -m 1777 /nix/attic-tmp
          bytes="$(cat "$RUNNER_TEMP/cold-attic-bytes.txt")"
          started=$SECONDS
          TMPDIR=/nix/attic-tmp nix run nixpkgs#attic-client -- push --jobs 1 ci:dotfiles --stdin < "$RUNNER_TEMP/cold-attic-path.txt"
          elapsed=$((SECONDS - started))
          echo "Cold Attic upload: $bytes bytes in ${elapsed}s"
          if (( elapsed > 0 )); then
            awk -v b="$bytes" -v s="$elapsed" 'BEGIN { printf "Cold Attic throughput: %.2f MiB/s\n", b / 1048576 / s }'
          fi

      - name: Upload build-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-path-${{ matrix.profile }}
          path: ${{ runner.temp }}/built-paths.txt
          if-no-files-found: ignore
