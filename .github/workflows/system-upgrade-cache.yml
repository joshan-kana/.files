name: System upgrade cache

on:
  pull_request:
    paths:
      - ".github/workflows/system-upgrade-cache.yml"
      - "flake.lock"
      - "flake.nix"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "pkgs/**"
      - "scripts/flake-update"
  push:
    branches:
      - main
      - "system-upgrade*"
      - "upgrade-validation*"
    paths:
      - ".github/workflows/system-upgrade-cache.yml"
      - "flake.lock"
      - "flake.nix"
      - "hosts/**"
      - "modules/**"
      - "overlays/**"
      - "pkgs/**"
      - "scripts/flake-update"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-upgrade-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.profile }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: nixos
            system: x86_64-linux
            runner: ubuntu-24.04
          - profile: nixos-arm-parallels
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - profile: nixos-orbstack
            system: aarch64-linux
            runner: ubuntu-24.04-arm
          - profile: nixos-server
            system: aarch64-linux
            runner: ubuntu-24.04-arm

    env:
      ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      NIX_CONFIG: |
        accept-flake-config = true
        experimental-features = nix-command flakes
        build-dir = /nix/build
        substituters = https://cache.nixos.org/ https://nix-community.cachix.org https://nixos-raspberrypi.cachix.org
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard private-repository runners expose only a small amount of disk
      # space. Give full NixOS closures a dedicated /nix volume while keeping
      # the runner toolchain intact for later GitHub Actions steps.
      - name: Expand Nix store
        uses: wimpysworld/nothing-but-nix@v4
        with:
          hatchet-protocol: carve

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Detect Attic availability
        id: attic
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ATTIC_ENDPOINT" \
             && -n "$ATTIC_TOKEN" \
             && -n "$TS_OAUTH_CLIENT_ID" \
             && -n "$TS_OAUTH_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Attic reuse/publishing is disabled until ATTIC_ENDPOINT, ATTIC_TOKEN, TS_OAUTH_CLIENT_ID, and TS_OAUTH_SECRET are configured."
          fi

      - name: Join tailnet
        if: steps.attic.outputs.enabled == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Enable Attic substituter
        if: steps.attic.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- login ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- use ci:dotfiles

      - name: Build host closure
        shell: bash
        run: |
          set -euo pipefail
          built_paths="$RUNNER_TEMP/built-paths.txt"
          : > "$built_paths"

          echo "::group::Disk space before build"
          df -h / /nix || true
          echo "::endgroup::"

          nix build \
            --no-link \
            --print-out-paths \
            ".#nixosConfigurations.${{ matrix.profile }}.config.system.build.toplevel" \
            | tee "$built_paths"

          echo "::group::Disk space after build"
          df -h / /nix || true
          echo "::endgroup::"

      - name: Publish closure to Attic
        if: steps.attic.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nix run nixpkgs#attic-client -- push ci:dotfiles --stdin < "$RUNNER_TEMP/built-paths.txt"

      - name: Upload build-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-path-${{ matrix.profile }}
          path: ${{ runner.temp }}/built-paths.txt
          if-no-files-found: ignore
