name: Patch Sentinel pull request project support

on:
  push:
    branches:
      - fix/sentinel-pr-project-items

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Patch bridge and tests
        run: python3 .github/scripts/patch-sentinel-pr-project-items.py

      - name: Run Sentinel bridge tests
        run: python3 .github/scripts/test_infrastructure_sentinel.py

      - name: Commit tested patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-sentinel-pr-project-items.yml
          git rm .github/scripts/patch-sentinel-pr-project-items.py
          git add .github/scripts/infrastructure-sentinel.py .github/scripts/test_infrastructure_sentinel.py
          git diff --cached --check
          git commit -m 'fix: support pull requests in Sentinel project bridge'
          git push origin HEAD:fix/sentinel-pr-project-items
