name: Update repo tooling lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update and validate lock
        run: |
          nix flake lock
          nix eval .#formatter.x86_64-linux.name >/dev/null
          nix eval .#devShells.x86_64-linux.default.name >/dev/null

      - name: Commit generated lock
        run: |
          rm .github/workflows/update-repo-tooling-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock .github/workflows/update-repo-tooling-lock.yml
          git commit -m 'chore: lock repo tooling inputs'
          git push
