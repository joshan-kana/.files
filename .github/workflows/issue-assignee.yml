name: Assign issues to joshan-kana

on:
  issues:
    types: [opened, reopened, transferred, unassigned]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure joshan-kana is assigned
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$REPOSITORY" --add-assignee joshan-kana
