name: System update

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Check the existing system-update branch without updating flake inputs
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches:
      - system-update

permissions:
  actions: write
  contents: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Update and validate dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: system-update

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)) && env.UPDATE_BRANCH || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Authenticate container registries
        if: github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for registry in docker.io docker.n8n.io; do
            printf '%s' "$DOCKERHUB_TOKEN" | docker login "$registry" --username "$DOCKERHUB_USERNAME" --password-stdin
          done

      - name: Prepare update branch
        if: github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          echo "validate=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          branch_exists=false
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            branch_exists=true
            git fetch origin "$UPDATE_BRANCH"
          fi

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ "$GITHUB_EVENT_NAME" == "schedule" && -n "$pr_number" ]]; then
            echo "An update PR (#$pr_number) is already open; leaving its editable branch untouched."
            exit 0
          fi

          if [[ "$branch_exists" == true ]]; then
            if [[ -z "$pr_number" ]] && ! git merge-base --is-ancestor "origin/$UPDATE_BRANCH" origin/main; then
              if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
                echo "Remote $UPDATE_BRANCH contains unmerged work without an open PR; leaving it untouched."
                exit 0
              fi

              echo "error: $UPDATE_BRANCH contains unmerged work but has no open PR; refusing to overwrite it." >&2
              exit 1
            fi

            if [[ -n "$pr_number" ]]; then
              git switch -C "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
              git merge --no-edit origin/main
            else
              git switch -C "$UPDATE_BRANCH" origin/main
            fi
          else
            git switch -c "$UPDATE_BRANCH" origin/main
          fi

          nix run .#system-update -- --all
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "update system"
          fi

          if git diff --quiet origin/main...HEAD && [[ -z "$pr_number" ]]; then
            echo "No flake updates are available."
            exit 0
          fi

          git push origin "HEAD:$UPDATE_BRANCH"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: update system" \
              --body "Automated Nix and container image updates."
          fi

          echo "validate=true" >> "$GITHUB_OUTPUT"

      - name: Check flake and start native builds
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.validate_only) ||
          steps.prepare.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          report_status() {
            local state="$1"
            local description="$2"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
              -f state="$state" \
              -f context="Nix flake check" \
              -f description="$description" \
              -f target_url="$run_url" \
              >/dev/null
          }

          report_status pending "Validating system update"
          trap 'report_status failure "Flake validation or build dispatch failed"' ERR
          if [[ "$GITHUB_EVENT_NAME" == "push" || ("$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.validate_only }}" == "true") ]]; then
            nix flake check
          fi
          gh workflow run nix-build-cache.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$UPDATE_BRANCH" \
            -f auto_merge_system_update=true
          trap - ERR
          report_status success "Flake check passed; native builds dispatched"
