name: Nix update compatibility

on:
  pull_request:
    paths:
      - patches/nix-update/portable-source-hash.patch
      - .github/workflows/nix-update-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-runner:
    name: Fresh Ubuntu runner, Nix source lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix using production installer
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Check source rooting with production Nix and real Git dirty revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "Nix: $(nix --version)"
          scratch="$(mktemp -d "$RUNNER_TEMP/nix-update-root.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/repo"
          git -C "$scratch/repo" init -q
          git -C "$scratch/repo" config user.email 'ci@example.invalid'
          git -C "$scratch/repo" config user.name 'CI fixture'
          printf '{ description = "gc-root test"; outputs = { self }: { }; }\n' > "$scratch/repo/flake.nix"
          git -C "$scratch/repo" add flake.nix
          git -C "$scratch/repo" commit -qm 'source fixture'
          for revision in 1 2 3; do
            printf '{ description = "gc-root test %s"; outputs = { self }: { }; }\n' "$revision" > "$scratch/repo/flake.nix"
            mkdir -p "$scratch/flake-$revision"
            source="$(cd "$scratch/repo" && nix flake metadata --json | jq -r .path)"
            echo "revision=$revision source=$source"
            if nix-store --realise --add-root "$scratch/flake-$revision/unregistered" "$source" > "$scratch/stdout" 2> "$scratch/stderr"; then
              echo 'Metadata path was already registered by Nix'
            else
              echo 'Metadata path requires explicit store registration:'
              cat "$scratch/stderr"
            fi
            if [[ ! -e "$source" ]]; then
              echo 'Metadata source is lazy; trying Nix-native materialisation mechanisms'
              nix flake archive --json "$scratch/repo" || true
              test ! -e "$source" || echo 'flake archive materialised the source'
              nix eval --raw --impure --expr "(builtins.getFlake \"path:$scratch/repo\").outPath" || true
              test ! -e "$source" || echo 'getFlake materialised the source'
              nix flake archive --json --to local "$scratch/repo" || true
              test ! -e "$source" || echo 'archive --to local materialised the source'
            fi
            if [[ -e "$source" ]]; then
              registered="$(nix store add-path --name source "$source")"
              nix-store --realise --add-root "$scratch/flake-$revision/source" "$registered"
              test -f "$registered/flake.nix"
              test -L "$scratch/flake-$revision/source"
              nix path-info "$registered" >/dev/null
              echo 'Materialised, registered, and rooted source successfully'
            else
              echo 'No Nix-native source materialisation method produced a physical path' >&2
              exit 1
            fi
          done
          echo 'Root command passed for dirty Git revisions'
