name: Nix update compatibility

on:
  pull_request:
    paths:
      - patches/nix-update/portable-source-hash.patch
      - .github/workflows/nix-update-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-update-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-lifecycle:
    name: Fresh Ubuntu Nix, concurrent dirty-source GC roots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
      - name: Materialise, register and root 48 concurrent Git snapshots
        shell: bash
        run: |
          set -euo pipefail
          nix --version
          scratch="$(mktemp -d "$RUNNER_TEMP/nix-update-roots.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          mkdir "$scratch/repo"
          git -C "$scratch/repo" init -q
          git -C "$scratch/repo" config user.email ci@example.invalid
          git -C "$scratch/repo" config user.name CI
          printf '{ description = "source test"; outputs = { self }: { }; }\n' > "$scratch/repo/flake.nix"
          git -C "$scratch/repo" add flake.nix
          git -C "$scratch/repo" commit -qm 'test fixture'
          printf 'never include untracked files\n' > "$scratch/repo/untracked.txt"
          for revision in $(seq 1 12); do
            printf '{ description = "source version %s"; outputs = { self }: { }; }\n' "$revision" > "$scratch/repo/flake.nix"
            for worker in 1 2 3 4; do
              (
                root="$scratch/flake-$revision-$worker"
                mkdir "$root"
                source="$(cd "$scratch/repo" && nix flake metadata --json | jq -r .path)"
                if [[ ! -d "$source" ]]; then
                  (cd "$scratch/repo" && nix flake archive --json --no-write-lock-file >/dev/null)
                fi
                registered="$(nix store add-path --name source "$source")"
                nix-store --realise --add-root "$root/source" "$registered" >/dev/null
                test -L "$root/source"
                test -f "$root/source/flake.nix"
                test ! -e "$root/source/untracked.txt"
                grep -q "source version $revision" "$root/source/flake.nix"
                nix path-info "$registered" >/dev/null
              ) &
            done
            wait
          done
          test "$(find "$scratch" -name source -type l | wc -l)" -eq 48
          echo 'PASS: 48 registered and GC-rooted evaluations, 12 dirty Git revisions'

  real-releases:
    name: Real Linux updater, grouped versions and Darwin sources
    needs: source-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
      - name: Build patched updater and exercise real upstream releases
        shell: bash
        run: |
          set -euo pipefail
          export NIX_REMOTE_SYSTEMS='' NIX_BUILD_HOOK=''
          updater="$(nix build --no-link --print-out-paths .#packages.x86_64-linux.nix-update)"
          test -x "$updater/bin/nix-update"
          scratch="$(mktemp -d "$RUNNER_TEMP/nix-update-releases.XXXXXX")"
          git worktree add --detach "$scratch/repo" HEAD
          trap 'git worktree remove --force "$scratch/repo"; rm -rf "$scratch"' EXIT
          cd "$scratch/repo"
          export NIX_PATH="nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"
          for version in 1.6.0 1.7.0; do
            "$updater/bin/nix-update" --flake --system x86_64-linux --override-filename overlays/agentgateway/default.nix --src-only --version "$version" agentgateway
          done
          git diff --exit-code -- overlays/agentgateway/default.nix
          echo 'PASS: native AgentGateway version and hash round trip'
          for version in 278.4.4020 276.4.5325; do
            "$updater/bin/nix-update" --flake --system aarch64-darwin --override-filename overlays/dropbox/default.nix --src-only --version "$version" dropbox
          done
          git diff --exit-code -- overlays/dropbox/default.nix
          echo 'PASS: real macOS Dropbox source hashes from Linux without remote builders'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('overlays/agentgateway/default.nix')
          s = p.read_text()
          for old, new in {
              'version = "1.7.0";': 'version = "1.6.0";',
              'aarch64-darwin = "sha256-NL/JYdDkWdD4kQMQDmFzDUtdjiFRyFHTPNA0oSbrK/4=";': 'aarch64-darwin = "sha256-bOvovVcmLtziOmWjdtL1onuXzf72CXQGQu2+deHpxoU=";',
              'aarch64-linux = "sha256-hXJKFdyfUXn7bi/YWwui1P6lbdKJq7i/j++tw76ouJ4=";': 'aarch64-linux = "sha256-tZ7KwxEDuzF9E3f9QrDLJc2aIfjD8dnuFMP/BfP5Gr8=";',
              'x86_64-linux = "sha256-Gy/AGi3inKETu7Yli1yuex6zxyQHHAnWh6RJEy8vQvg=";': 'x86_64-linux = "sha256-SW7SfmqWtVqa18q+XCvnFyUR9Eo8sRPlM9Ir+Tp/B50=";',
          }.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          nix run "path:$PWD#system-update" -- --package agentgateway --system x86_64-linux
          git diff --exit-code -- overlays/agentgateway/default.nix
          echo 'PASS: actual system-update CLI, grouped cross-platform hashes, and native build'

  native-macos:
    name: Native macOS pinned updater and real release hashes
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
      - name: Build and run patched updater with only its real flake inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          export NIX_REMOTE_SYSTEMS='' NIX_BUILD_HOOK=''
          fixture="$(mktemp -d "$RUNNER_TEMP/nix-update-darwin.XXXXXX")"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/overlays/nix-update" "$fixture/overlays/agentgateway" "$fixture/patches/nix-update"
          cp overlays/nix-update/default.nix "$fixture/overlays/nix-update/default.nix"
          cp overlays/agentgateway/default.nix "$fixture/overlays/agentgateway/default.nix"
          cp patches/nix-update/portable-source-hash.patch "$fixture/patches/nix-update/portable-source-hash.patch"
          python3 - "$fixture" flake.lock <<'PY'
          import json
          from pathlib import Path
          import sys
          fixture = Path(sys.argv[1])
          lock = json.loads(Path(sys.argv[2]).read_text())
          name = lock['nodes']['root']['inputs']['nixpkgs']
          nixpkgs = lock['nodes'][name]
          output = {'version': 7, 'root': 'root', 'nodes': {
              'root': {'inputs': {'nixpkgs': 'nixpkgs'}},
              'nixpkgs': nixpkgs,
          }}
          (fixture / 'flake.lock').write_text(json.dumps(output, indent=2) + '\n')
          source = """{
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/__NIXPKGS_REV__";
            outputs = { self, nixpkgs }:
              let
                pkgs = import nixpkgs {
                  system = "aarch64-darwin";
                  overlays =
                    (import ./overlays/nix-update/default.nix { }).nixpkgs.overlays
                    ++ (import ./overlays/agentgateway/default.nix { }).nixpkgs.overlays;
                };
              in
              { packages.aarch64-darwin = {
                  nix-update = pkgs.nix-update;
                  agentgateway = pkgs.agentgateway;
                };
              };
          }
          """
          (fixture / 'flake.nix').write_text(source.replace('__NIXPKGS_REV__', nixpkgs['locked']['rev']))
          PY
          git -C "$fixture" init -q
          git -C "$fixture" config user.name CI
          git -C "$fixture" config user.email ci@example.invalid
          git -C "$fixture" add flake.nix flake.lock overlays patches
          git -C "$fixture" commit -qm 'pinned updater fixture'
          cd "$fixture"
          updater="$(nix build --no-link --print-out-paths .#nix-update)"
          test -x "$updater/bin/nix-update"
          export NIX_PATH="nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')"
          for version in 1.6.0 1.7.0; do
            "$updater/bin/nix-update" --flake --system aarch64-darwin --override-filename overlays/agentgateway/default.nix --src-only --version "$version" agentgateway
          done
          git diff --exit-code -- overlays/agentgateway/default.nix
          echo 'PASS: native ARM64 macOS Nix 2.35 real version/hash update using repository-pinned updater'
