name: Infrastructure Sentinel bridge

on:
  issues:
    types: [edited]

  schedule:
    - cron: "45 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: infrastructure-sentinel
  cancel-in-progress: false

jobs:
  bridge:
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.action == 'edited' &&
        github.event.issue.number == 71 &&
        contains(github.event.issue.body, '<!-- infrastructure-sentinel-command:v1')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out bridge code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Refresh snapshot or apply command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INFRASTRUCTURE_SENTINEL_PROJECT_TOKEN: ${{ secrets.INFRASTRUCTURE_SENTINEL_PROJECT_TOKEN }}
          RUN_MODE: ${{ github.event_name == 'issues' && 'command' || 'snapshot' }}
        run: python3 .github/scripts/infrastructure-sentinel.py
